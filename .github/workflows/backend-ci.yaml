name: Backend Continuous Integration

# Runs quality checks on every PR that touches the backend, and can also be
# triggered manually from the Actions tab (workflow_dispatch) without a code
# push, per the project requirements.
on:
  pull_request:
    branches: [main]
    paths:
      - "starter/backend/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: starter/backend

jobs:
  # ---- Code style check -----------------------------------------------
  code-quality:
    name: Flake8 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore pipenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: backend-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: backend-pipenv-

      - name: Install pipenv and project dependencies
        run: |
          pip install pipenv
          pipenv install --dev

      - name: Run flake8 via pipenv
        run: pipenv run lint

  # ---- Unit tests -------------------------------------------------------
  unit-tests:
    name: Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore pipenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: backend-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: backend-pipenv-

      - name: Install pipenv and project dependencies
        run: |
          pip install pipenv
          pipenv install --dev

      - name: Run pytest via pipenv
        run: pipenv run test

  # ---- Docker build (only after lint + tests are green) -----------------
  docker-image:
    name: Build Backend Image
    needs: [code-quality, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image (validation only, not pushed)
        run: docker build --tag mp-backend:ci-${{ github.run_number }} .
