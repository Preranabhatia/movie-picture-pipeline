name: Frontend Continuous Deployment

# Fires on every merge to main that touches the frontend. Builds a fresh
# image (with the backend API URL baked in via build-arg), pushes it to
# ECR tagged with the commit SHA, then rolls it out to the EKS cluster.
on:
  push:
    branches: [main]
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: us-east-1
  EKS_CLUSTER: cluster
  ECR_REPO_NAME: frontend

defaults:
  run:
    working-directory: starter/frontend

jobs:
  code-quality:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: frontend-npm-
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Jest Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: frontend-npm-
      - run: npm ci
      - run: npm test
        env:
          CI: true

  # ---- Build the image and push it to ECR, tagged with the commit SHA ---
  push-to-ecr:
    name: Push Image to ECR
    needs: [code-quality, unit-tests]
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assume AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Authenticate Docker to ECR
        id: ecr-auth
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push tagged image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-auth.outputs.registry }}
          COMMIT_TAG: ${{ github.sha }}
          BACKEND_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          FULL_URI="$REGISTRY/${{ env.ECR_REPO_NAME }}:$COMMIT_TAG"
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$BACKEND_URL" \
            --tag "$FULL_URI" .
          docker push "$FULL_URI"
          echo "image_uri=$FULL_URI" >> "$GITHUB_OUTPUT"

  # ---- Roll the newly pushed image out to the cluster --------------------
  deploy-to-cluster:
    name: Deploy to EKS
    needs: push-to-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assume AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Ensure kubectl CLI is present
        uses: azure/setup-kubectl@v4

      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_DEFAULT_REGION }}

      - name: Install kustomize CLI
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Set the new image tag and apply manifests
        working-directory: starter/frontend/k8s
        env:
          IMAGE_URI: ${{ needs.push-to-ecr.outputs.image_uri }}
        run: |
          kustomize edit set image frontend="$IMAGE_URI"
          kustomize build | kubectl apply -f -
